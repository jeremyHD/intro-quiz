name: Resolve YouTube IDs

on:
  workflow_dispatch:
  push:
    paths:
      - data/songs.json
      - scripts/resolve_youtube.py
      - .github/workflows/resolve-youtube.yml

permissions:
  contents: write

concurrency:
  group: resolve-youtube-${{ github.ref }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yt-dlp
      - run: python scripts/resolve_youtube.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/songs.json data/review.csv
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fill in YouTube IDs [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
